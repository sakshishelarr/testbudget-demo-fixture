[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testbudget-demo-fixture"
version = "0.1.0"
description = "Small deterministic repository for demonstrating TestBudget"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["demoapp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]